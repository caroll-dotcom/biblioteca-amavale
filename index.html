<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#202020">
<title>Biblioteca Amavale</title>
<style>html,body{margin:0;min-height:100%;background:#ecebe6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.loading{min-height:100vh;display:grid;place-items:center;color:#202020}.loading div{text-align:center}.loading b{display:block;margin-bottom:8px}.loading span{font-size:13px;color:#777}</style>
</head>
<body>
<div class="loading"><div><b>Biblioteca Amavale</b><span>Leitura que Vale</span></div></div>
<script>
fetch('./app.html?v=5').then(r=>{if(!r.ok)throw new Error('Falha ao carregar');return r.text()}).then(html=>{
  html=html.replace('https://avatars.githubusercontent.com/u/297288615?v=4','/biblioteca-amavale/logo-amavale.jpg?v=3');
  html=html.replace('>Voluntários</button>','>Entrar</button>');
  document.open();
  document.write(html);
  document.close();

  const responsive=document.createElement('link');
  responsive.rel='stylesheet';
  responsive.href='./responsive.css?v=3';
  document.head.appendChild(responsive);

  const authScript=document.createElement('script');
  authScript.type='module';
  authScript.src='./auth.js?v=7';
  authScript.onload=()=>{
    const mobileFix=document.createElement('script');
    mobileFix.type='module';
    mobileFix.src='./auth-mobile-fix.js?v=1';
    mobileFix.onload=()=>{
      const lookupFix=document.createElement('script');
      lookupFix.src='./isbn-lookup-fix.js?v=2';
      lookupFix.onload=()=>{
        const isbnScript=document.createElement('script');
        isbnScript.type='module';
        isbnScript.src='./isbn.js?v=2';
        isbnScript.onload=()=>{
          const qrLabel=document.createElement('script');
          qrLabel.src='./qr-label.js?v=1';
          qrLabel.onload=()=>{
            const memberLoans=document.createElement('script');
            memberLoans.type='module';
            memberLoans.src='./member-loans.js?v=2';
            memberLoans.onload=()=>{
              const responsiveLast=document.createElement('link');
              responsiveLast.rel='stylesheet';
              responsiveLast.href='./responsive.css?v=3';
              document.head.appendChild(responsiveLast);
            };
            document.body.appendChild(memberLoans);
          };
          document.body.appendChild(qrLabel);
        };
        document.body.appendChild(isbnScript);
      };
      document.body.appendChild(lookupFix);
    };
    document.body.appendChild(mobileFix);
  };
  document.body.appendChild(authScript);
}).catch(()=>{document.body.innerHTML='<div class="loading"><div><b>Biblioteca Amavale</b><span>Não foi possível carregar o site. Atualize a página.</span></div></div>'});
</script>
</body>
</html>
