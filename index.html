<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#202020">
<title>Biblioteca Amavale</title>
<style>html,body{margin:0;min-height:100%;background:#ecebe6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.loading{min-height:100vh;display:grid;place-items:center;color:#202020}.loading div{text-align:center}.loading b{display:block;margin-bottom:8px}.loading span{font-size:13px;color:#777}</style>
</head>
<body>
<div class="loading"><div><b>Biblioteca Amavale</b><span>Leitura que Vale</span></div></div>
<script>
fetch('./app.html?v=2').then(r=>{if(!r.ok)throw new Error('Falha ao carregar');return r.text()}).then(html=>{
  html=html.replace('https://avatars.githubusercontent.com/u/297288615?v=4','./logo-amavale.jpg?v=1');
  document.open();document.write(html);document.close();
}).catch(()=>{document.body.innerHTML='<div class="loading"><div><b>Biblioteca Amavale</b><span>Não foi possível carregar o site. Atualize a página.</span></div></div>'});
</script>
</body>
</html>
